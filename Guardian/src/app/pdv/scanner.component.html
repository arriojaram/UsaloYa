<div class="card shadow-sm my-3 mx-auto" style="max-width: 500px;">
  <div class="card-body">
    <h5 class="d-none d-md-block mb-3 text-primary">
      <i class="bi bi-upc-scan me-2"></i>Punto de Venta - Escanea o ingresa el código
    </h5>
    <form [formGroup]="formVenta" (ngSubmit)="addProductToSaleList()" class="d-flex flex-column gap-2">
      <div>
        <label for="codigo" class="form-label visually-hidden">Código de barras</label>
        <input id="codigo" type="text" formControlName="codigo" class="form-control form-control-lg"
          placeholder="Código de barras o SKU" autocomplete="off" autofocus>
      </div>
      <div class="d-flex justify-content-between gap-2">
        <button type="submit" class="btn btn-warning flex-fill" [disabled]="formVenta.invalid">
          <i class="bi bi-plus-circle me-1"></i>Agregar
        </button>
        <button type="button" class="btn btn-outline-primary flex-fill" (click)="showSearchProduct()">
          <i class="bi bi-search me-1"></i>{{ this.custButtonLabel }}
        </button>
      </div>
    </form>
    <div id="message-product-added" [class]="messageClass" [hidden]="isHidden" class="mt-2">
      <div class="alert alert-success py-2 px-3 mb-0" *ngIf="!isHidden">
        {{ label_productoAdded }}
      </div>
    </div>
  </div>
</div>

<!-- Panel para buscar producto -->
<div id="search-product-panel" *ngIf="isSearchingProduct" class="mt-3 col-12 col-sm-6 mx-auto border bg-light rounded shadow-sm p-3">
  <div>
    <input id="search-product-input" type="text" class="form-control mb-2" #searchInput (click)="searchInput.select()"
      [(ngModel)]="productName" placeholder="Buscar producto por nombre o SKU"
      autocomplete="off" (keydown.enter)="searchProduct()" />
    <ul *ngIf="filteredProduct.length > 0" class="list-group mt-2" style="max-height: 200px; overflow-y: auto;">
      <li *ngFor="let p of filteredProduct" class="list-group-item list-group-item-action"
          (click)="selectProduct(p)" style="cursor:pointer;">
        <span class="fw-bold">{{ p.sku }}</span> - {{ p.name }}
      </li>
    </ul>
    <div class="d-flex gap-2 mt-2">
      <button class="btn btn-primary flex-fill" (click)="searchProduct()">
        <i class="bi bi-search"></i> Buscar
      </button>
      <button class="btn btn-secondary flex-fill" (click)="showSearchProduct()">
        <i class="bi bi-x-circle"></i> Cancelar
      </button>
      <button class="btn btn-outline-dark flex-fill" type="button" (click)="cleanSearchProdPanel()">
        <i class="bi bi-eraser"></i> Limpiar
      </button>
    </div>
  </div>
</div>

<app-lista-venta></app-lista-venta>
