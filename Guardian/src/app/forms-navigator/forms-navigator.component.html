<div class="stepper-wrapper container py-4">
  <!-- BARRA DE PASOS -->
  <div class="steps-horizontal d-flex justify-content-between mb-4 flex-wrap">
    <div
      class="step-horizontal text-center flex-fill mx-2"
      *ngFor="let step of steps; let i = index"
      [ngClass]="{
        'active': currentStep === i,
        'complete': step.completed && currentStep !== i
      }"
      (click)="navigateToStep(i)"
      style="cursor: pointer;"
    >
      <div class="step-icon rounded-circle mx-auto mb-2">{{ i + 1 }}</div>
      <div class="step-title fw-bold">{{ step.label }}</div>
      <div class="step-description text-muted">Paso {{ i + 1 }}</div>
    </div>
  </div>

  <!-- FORMULARIO -->
  <div class="form-wrapper mb-4">
    <router-outlet></router-outlet>
  </div>

  <!-- BOTONES DE NAVEGACIÓN -->
  <div class="stepper-buttons d-flex justify-content-between">
    <button
      class="btn btn-secondary"
      (click)="goBack()"
      [disabled]="currentStep === 0"
    >
      ← Regresar
    </button>
    <button
      class="btn btn-primary"
      (click)="goNext()"
      [disabled]="currentStep === steps.length - 1"
    >
      Siguiente →
    </button>
  </div>
</div>
