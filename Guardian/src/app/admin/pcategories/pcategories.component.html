<!-- Product Categories Management Section -->
<div class="container-fluid px-0">
  <!-- Professional Toolbar Header -->
  <div class="bg-white border-bottom shadow-sm mb-3">
    <div class="container-fluid">
      <div class="d-flex align-items-center justify-content-between py-1">
        <div class="d-flex align-items-center">
          <button class="btn btn-ghost me-3" (click)="navigationService.toggleSearchPanel()">
            <i class="{{navigationService.toogleClass}} fs-5 text-usalo-primary"></i>
          </button>
          <div class="toolbar-title-group">
            <h5 class="mb-0 fw-bold text-dark d-flex align-items-center">
              Gestión de Categorías
              <span class="ms-2 badge bg-usalo-primary-10 text-usalo-primary rounded-pill small">
                ({{categoryList.length || 0}})
              </span>
            </h5>
          </div>
        </div>

        <div class="toolbar-actions d-flex align-items-center gap-2">
          <button type="button" class="btn btn-usalo-primary btn-sm" (click)="newRecord()">
            <i class="bi bi-plus-circle me-1"></i>
            <span class="d-none d-sm-inline">Nueva Categoría</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="row g-2">
    <!-- Search and Filter Panel -->
    <div class="col-12 col-lg-4" [class.d-none]="navigationService.isSearchPanelHidden">
      <div class="card shadow-sm h-100">
        <div class="card-header bg-usalo-info-gradient text-white py-1">
          <h6 class="mb-0 d-flex align-items-center small">
            <i class="bi bi-search me-1 fs-6"></i>Buscar Categoría
          </h6>
        </div>
        <div class="card-body p-3">
          <!-- Search Section -->
          <div class="mb-3">
            <label class="form-label fw-bold text-muted" style="font-size: 0.75rem;">BUSCAR CATEGORÍAS</label>
            <div class="input-group">
              <span class="input-group-text bg-light">
                <i class="bi bi-search text-info" style="font-size: 0.85rem;"></i>
              </span>
              <input type="text" class="form-control form-control-sm" [(ngModel)]="navigationService.searchItem"
                placeholder="Nombre de categoría..." autocomplete="off">
              <button class="btn btn-outline-info btn-sm" type="button" (click)="filter()">
                <i class="bi bi-search" style="font-size: 0.8rem;"></i>
              </button>
            </div>
            <button *ngIf="navigationService.searchItem" class="btn btn-outline-secondary btn-sm mt-1 small"
              (click)="navigationService.searchItem = ''; filter()">
              <i class="bi bi-x-circle me-1"></i>Limpiar búsqueda
            </button>
          </div>

          <!-- Categories List -->
          <div>
            <label class="form-label fw-bold text-muted" style="font-size: 0.75rem;">CATEGORÍAS ENCONTRADAS</label>
            <div class="border rounded bg-white" style="max-height: 400px; overflow-y: auto;">
              <div *ngFor="let c of categoryList; let i = index"
                class="list-group-item list-group-item-action border-0 border-bottom py-2"
                [class.bg-primary]="this.selectedItem?.categoryId == c.categoryId"
                [class.text-white]="this.selectedItem?.categoryId == c.categoryId"
                [class.bg-light]="this.selectedItem?.categoryId != c.categoryId && i % 2 === 0"
                (click)="selectItem(c.categoryId)" style="cursor: pointer;">
                <div class="d-flex justify-content-between align-items-center px-2 py-1">
                  <div>
                    <div class="fw-bold small">{{ c.name }}</div>
                    <small class="opacity-75" style="font-size: 0.7rem;" *ngIf="c.description">
                      {{ c.description }}
                    </small>
                  </div>
                  <i class="bi bi-arrow-right-circle" style="font-size: 0.9rem;"></i>
                </div>
              </div>

              <!-- Empty State -->
              <div *ngIf="!categoryList || categoryList.length === 0" class="text-center py-3 text-muted">
                <i class="bi bi-tags fs-1 mb-2 d-block"></i>
                <h6 class="small">No hay categorías</h6>
                <small style="font-size: 0.7rem;">Intenta ajustar los filtros de búsqueda</small>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Category Details Form -->
    <div class="col-12" [class.col-lg-8]="!navigationService.isSearchPanelHidden"
      [class.col-lg-12]="navigationService.isSearchPanelHidden">
      <form [formGroup]="cForm">
        <!-- Basic Information Card -->
        <div class="card shadow-sm mb-2">
          <div class="card-header bg-usalo-success-gradient text-white py-1">
            <h6 class="mb-0 d-flex align-items-center small">
              <i class="bi bi-info-circle me-1 fs-6"></i>Información de la Categoría
            </h6>
          </div>
          <div class="card-body p-3">
            <div class="row g-2">
              <!-- Category Name -->
              <div class="col-12">
                <label for="categoryName" class="form-label fw-bold small">Nombre de la Categoría *</label>
                <div class="input-group input-group-sm">
                  <span class="input-group-text bg-light">
                    <i class="bi bi-tag text-success" style="font-size: 0.85rem;"></i>
                  </span>
                  <input id="categoryName" type="text" class="form-control" formControlName="name"
                    placeholder="Ingresa el nombre de la categoría">
                </div>
                <div *ngIf="cForm.get('name')?.invalid && cForm.get('name')?.touched"
                  class="text-danger mt-1" style="font-size: 0.75rem;">
                  <i class="bi bi-exclamation-circle me-1"></i>El nombre es obligatorio.
                </div>
              </div>

              <!-- Category Description -->
              <div class="col-12">
                <label for="categoryDescription" class="form-label fw-bold small">Descripción</label>
                <div class="input-group input-group-sm">
                  <span class="input-group-text bg-light">
                    <i class="bi bi-card-text text-info" style="font-size: 0.85rem;"></i>
                  </span>
                  <textarea id="categoryDescription" class="form-control" formControlName="description" rows="3"
                    placeholder="Descripción detallada de la categoría (opcional)"></textarea>
                </div>
                <small class="text-muted mt-1" style="font-size: 0.7rem;">Información adicional sobre la categoría</small>
              </div>
            </div>
          </div>
        </div>

        <!-- Action Buttons Card -->
        <div class="card shadow-sm mt-2">
          <div class="card-body p-2">
            <div class="d-flex justify-content-end gap-2">
              <button type="button" class="btn btn-outline-danger" (click)="deleteRecord()" 
                [disabled]="!this.selectedItem">
                <i class="bi bi-trash me-1" style="font-size: 0.9rem;"></i>
                <span class="small">Eliminar</span>
              </button>
              <button type="button" class="btn btn-outline-secondary" (click)="newRecord()">
                <i class="bi bi-plus-circle me-1" style="font-size: 0.9rem;"></i>
                <span class="small">Nueva Categoría</span>
              </button>
              <button type="button" class="btn btn-success" (click)="save()" [disabled]="cForm.invalid">
                <i class="bi bi-save me-1" style="font-size: 0.9rem;"></i>
                <span class="small">Guardar Categoría</span>
              </button>
            </div>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
